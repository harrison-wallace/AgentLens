name: Feature request
description: Suggest an idea for AgentLens
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Related roadmap phase
      description: See the roadmap table in the README.
      options:
        - "Phase 1 — Local observer MVP"
        - "Phase 2 — Agent integration"
        - "Phase 3 — Git actions and polish"
        - "Phase 4 — Remote"
        - "Post-MVP (ROADMAP.md)"
        - Not sure
    validations:
      required: true
