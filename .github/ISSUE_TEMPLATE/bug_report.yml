name: Bug report
description: Report a problem with AgentLens
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Ubuntu
        - Other Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AgentLens version
      description: Shown in the window title bar.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent in use
      description: Which terminal coding agent were you observing, if any?
      options:
        - Claude Code
        - opencode
        - none
        - other
    validations:
      required: true
