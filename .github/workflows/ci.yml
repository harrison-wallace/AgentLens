name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Cargo workspace lives at the repo root (`core`, `daemon`, `src-tauri`),
# so every cargo command below runs from there — the app crate alone would
# skip `core`, where nearly all the logic lives.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # CI only needs to prove the app compiles and links; the installers it
      # would produce are discarded. Bundling them cost ~15 min on Linux,
      # where the rpm bundler gzips the 225 MB debug binary at ~250 KB/s.
      # release.yml is what actually builds artifacts.
      - name: tauri build (debug, no bundle)
        run: npm run tauri build -- --debug --no-bundle

  # Built here rather than inside the distro below: a Rust build over WSL 1's
  # Windows-filesystem bridge takes an order of magnitude longer, and this
  # runner is pinned to the same Ubuntu the distro is, so the binary links
  # against a glibc it will actually find.
  daemon-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p agentlens-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: agentlens-daemon-linux-x86_64
          path: target/release/agentlens-daemon
          if-no-files-found: error

  # The remote path can only be proven by actually crossing a boundary: a
  # daemon inside a Linux distro, watching that distro's own filesystem,
  # driven from Windows over `wsl.exe`. Everything else about the remote split
  # is unit-testable; this is not.
  wsl-smoke:
    runs-on: windows-latest
    needs: daemon-linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          # WSL 1: standard GitHub Windows runners have no nested
          # virtualisation. inotify works on WSL 1's own filesystem, which is
          # exactly what is under test — `\\wsl$` is the thing that does not.
          wsl-version: 1
          set-as-default: "false"

      - uses: actions/download-artifact@v4
        with:
          name: agentlens-daemon-linux-x86_64
          path: daemon-bin

      # Artifacts lose their permission bits in the round trip, hence -m755.
      - name: Install the daemon into the distro
        shell: wsl-bash {0}
        run: |
          set -eux
          install -Dm755 daemon-bin/agentlens-daemon /usr/local/bin/agentlens-daemon
          agentlens-daemon --version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: End-to-end over wsl.exe
        env:
          AGENTLENS_WSL_DISTRO: Ubuntu-24.04
          AGENTLENS_WSL_DAEMON: /usr/local/bin/agentlens-daemon
        run: >
          cargo test -p agentlens --lib --
          --ignored --exact --nocapture
          backend::child::tests::a_daemon_inside_wsl_reports_changes_made_inside_wsl
