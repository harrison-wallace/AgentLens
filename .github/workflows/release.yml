name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft, created first. GitHub lets several drafts share a tag, and
  # tauri-action looks releases up by tag — an API that does not return
  # drafts. If the installer jobs create the release themselves they each
  # open a new draft, and the installers never land next to the daemons.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AgentLens ${{ github.ref_name }}"
          body: "See CHANGELOG.md for details."
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is pinned (not ubuntu-latest) for AppImage glibc
        # compatibility — newer glibc breaks older systems' AppImage support.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Build only. Omit tagName so tauri-action does not open another draft.
      - uses: tauri-apps/tauri-action@v0

      - name: Upload Linux installers
        if: matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/deb/AgentLens_*.deb
            target/release/bundle/appimage/AgentLens_*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/AgentLens_*-setup.exe
            target/release/bundle/msi/AgentLens_*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The daemon is not part of any installer: it is downloaded straight onto the
  # machine holding the files (a WSL distro, an SSH host), which is usually not
  # the machine the app is installed on and often not even the same OS. So it
  # ships as bare binaries whose names say what they run on, and the setup
  # guide's one-liner is a `curl` for exactly these.
  #
  # Built on ubuntu-22.04 rather than the newest runner: glibc is backwards
  # compatible, not forwards, so the oldest one we build on is the oldest
  # distro the binary works in.
  daemon:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: agentlens-daemon-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset: agentlens-daemon-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agentlens-daemon-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `git2` vendors and compiles libgit2, so a cross build needs a C
      # cross-compiler and cargo needs telling which linker to use.
      - name: Install the aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p agentlens-daemon --target ${{ matrix.target }}

      - name: Name the binary after what it runs on
        shell: bash
        run: |
          set -eux
          src=target/${{ matrix.target }}/release/agentlens-daemon
          [ -f "$src" ] || src="$src.exe"
          cp "$src" "${{ matrix.asset }}"

      # Uploaded per-target and concatenated below, because the three builds
      # run on different machines and never see each other's binaries.
      - name: Checksum
        shell: bash
        run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.asset }}
          path: ${{ matrix.asset }}.sha256
          if-no-files-found: error

      # Same draft release the installers land in, so a release is one place.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A remote installing its own daemon has no way to know it got what we built
  # unless we say so somewhere it can fetch. One file covering every daemon
  # binary, in the format `sha256sum -c` already understands.
  checksums:
    needs: daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Combine
        run: |
          set -eux
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
