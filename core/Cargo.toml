[package]
name = "agentlens-core"
version = "0.2.1"
description = "Filesystem, git and agent observation for AgentLens — no UI, no Tauri"
authors = ["Harrison Wallace"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
git2 = { version = "0.20", default-features = false }
notify = "8"
notify-debouncer-full = "0.6"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
